<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Google Ads Growth — Control Room</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#14181f; --mute:#5b6573; --line:#e1e5ea; --accent:#1a56db; --ok:#0a7d4b; --warn:#b45309; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#161b22; --ink:#e6e9ee; --mute:#9aa4b2; --line:#262d37; --accent:#6ea0ff; --ok:#3ecf8e; --warn:#f0b04a; --bad:#ff7b72; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:17px; margin:0; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  nav { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  nav button, .btn { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  nav button[aria-current="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat b { display:block; font-size:26px; }
  .stat span, .mute { color:var(--mute); font-size:13px; }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  th { color:var(--mute); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .HIGH,.REJECTED,.FAILED { color:var(--bad); } .MEDIUM,.PROPOSED { color:var(--warn); } .LOW,.EXECUTED,.APPROVED { color:var(--ok); }
  .bar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; min-width:80px; } .bar i { display:block; height:100%; background:var(--accent); }
  #login { max-width:420px; margin:60px auto; } input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; margin:8px 0 12px; }
  #msg { color:var(--bad); min-height:1.4em; } .empty { padding:24px; text-align:center; color:var(--mute); }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:12px; max-width:420px; }
  details summary { cursor:pointer; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Google Ads Growth — Control Room</h1>
  <div><span class="mute" id="stamp"></span> <button class="btn" id="refresh" hidden>Refresh</button> <button class="btn" id="logout" hidden>Sign out</button></div>
</header>
<main>
  <section id="login" class="card">
    <h2 style="margin-top:0">Sign in</h2>
    <p class="mute">Enter the server's <code>MCP_API_KEY</code>. It is kept only in this browser tab (session storage) and sent as a bearer token. The dashboard is read-only.</p>
    <input id="key" type="password" autocomplete="off" placeholder="MCP_API_KEY">
    <button class="btn" id="go">Open dashboard</button>
    <div id="msg" role="alert"></div>
  </section>
  <section id="app" hidden>
    <nav id="tabs"></nav>
    <div id="view"></div>
  </section>
</main>
<script>
(function () {
  var VIEWS = [["overview","Overview"],["clients","Clients"],["accounts","Google Ads accounts"],["approvals","Approvals"],["changes","Change log"]];
  var current = "overview";
  var $ = function (id) { return document.getElementById(id); };
  function key() { try { return sessionStorage.getItem("k") || ""; } catch (e) { return ""; } }
  function setKey(v) { try { v ? sessionStorage.setItem("k", v) : sessionStorage.removeItem("k"); } catch (e) {} }
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) { if (k === "text") n.textContent = props[k]; else if (k === "cls") n.className = props[k]; else n.setAttribute(k, props[k]); });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function pill(v) { return el("span", { cls: "pill " + v, text: v }); }
  function fmtDate(v) { return v ? new Date(v).toLocaleString() : "—"; }
  function table(cols, rows) {
    if (!rows.length) return el("div", { cls: "empty card", text: "Nothing here yet." });
    var thead = el("thead", null, [el("tr", null, cols.map(function (c) { return el("th", { text: c.h }); }))]);
    var tbody = el("tbody", null, rows.map(function (r) { return el("tr", null, cols.map(function (c) { var td = el("td"); var v = c.f(r); if (v instanceof Node) td.appendChild(v); else td.textContent = v == null ? "—" : String(v); return td; })); }));
    return el("div", { cls: "tablewrap" }, [el("table", null, [thead, tbody])]);
  }
  function json(v) { return el("details", null, [el("summary", { text: "View" }), el("pre", { text: JSON.stringify(v, null, 2) })]); }
  var renderers = {
    overview: function (d) {
      var c = d.counts, s = [["Clients", c.clients], ["Ads accounts", c.accounts], ["Manager accounts", c.managerAccounts], ["Pending approvals", c.pendingApprovals], ["Changes (24h)", c.changesLast24h], ["Executed changes", c.executedChanges]];
      var grid = el("div", { cls: "grid" }, s.map(function (x) { return el("div", { cls: "card stat" }, [el("b", { text: x[1] }), el("span", { text: x[0] })]); }));
      var cfg = el("div", { cls: "card" }, [
        el("div", { text: "Approval mode: " + d.config.approvalMode }),
        el("div", { text: "Google Ads connected: " + (d.config.googleAdsConfigured ? "yes" : "NO — set the four GOOGLE_ADS_* credentials") }),
        el("div", { text: "Manager (MCC) login ID set: " + (d.config.loginCustomerIdSet ? "yes" : "no") })
      ]);
      var wrap = el("div"); wrap.appendChild(grid); wrap.appendChild(cfg); return wrap;
    },
    clients: function (d) { return table([
      { h: "Client", f: function (r) { return r.name; } }, { h: "Type", f: function (r) { return r.businessType; } },
      { h: "Website", f: function (r) { return r.website; } }, { h: "Accounts", f: function (r) { return r.linkedAccounts; } },
      { h: "Onboarding", f: function (r) { return el("div", null, [el("div", { cls: "bar" }, [el("i", { style: "width:" + r.onboarding.completenessPct + "%" })]), el("span", { cls: "mute", text: r.onboarding.completenessPct + "%" + (r.onboarding.readyForResearch ? " · research-ready" : "") })]); } },
      { h: "Next question", f: function (r) { return r.onboarding.nextQuestion; } }
    ], d); },
    accounts: function (d) { return table([
      { h: "Customer ID", f: function (r) { return r.customerId; } }, { h: "Name", f: function (r) { return r.name; } },
      { h: "Type", f: function (r) { return r.type; } }, { h: "Currency", f: function (r) { return r.currency; } },
      { h: "Client", f: function (r) { return r.client && r.client.name; } }, { h: "Linked", f: function (r) { return fmtDate(r.linkedAt); } }
    ], d); },
    approvals: function (d) { return table([
      { h: "Created", f: function (r) { return fmtDate(r.createdAt); } }, { h: "Status", f: function (r) { return pill(r.status); } },
      { h: "Risk", f: function (r) { return pill(r.riskLevel); } }, { h: "Summary", f: function (r) { return r.summary; } },
      { h: "Account", f: function (r) { return r.account && r.account.customerId; } }, { h: "Decision", f: function (r) { return r.decidedBy ? r.decidedBy + (r.decisionNote ? ": " + r.decisionNote : "") : "—"; } },
      { h: "Payload", f: function (r) { return json(r.proposedChange); } }
    ], d); },
    changes: function (d) { return table([
      { h: "When", f: function (r) { return fmtDate(r.createdAt); } }, { h: "Account", f: function (r) { return r.account && r.account.customerId; } },
      { h: "Change", f: function (r) { return r.operation + " " + r.resourceType; } }, { h: "Risk", f: function (r) { return pill(r.riskLevel); } },
      { h: "Status", f: function (r) { return pill(r.status); } }, { h: "Reasoning", f: function (r) { return r.reasoning + (r.errorMessage ? " — ERROR: " + r.errorMessage : ""); } }
    ], d); }
  };
  function show(loggedIn) { $("login").hidden = loggedIn; $("app").hidden = !loggedIn; $("logout").hidden = !loggedIn; $("refresh").hidden = !loggedIn; }
  function tabs() {
    var nav = $("tabs"); nav.textContent = "";
    VIEWS.forEach(function (v) { var b = el("button", { text: v[1], "aria-current": String(v[0] === current) }); b.onclick = function () { current = v[0]; tabs(); load(); }; nav.appendChild(b); });
  }
  function load() {
    var box = $("view"); box.textContent = "Loading…";
    fetch("/api/dashboard?view=" + current, { headers: { Authorization: "Bearer " + key() } }).then(function (r) {
      if (r.status === 401 || r.status === 503) { return r.json().then(function (j) { setKey(""); show(false); $("msg").textContent = j.error || "Not authorised."; }); }
      return r.json().then(function (j) {
        if (!r.ok) { box.textContent = j.error || "Request failed."; return; }
        box.textContent = ""; box.appendChild(renderers[current](j.data)); $("stamp").textContent = "Updated " + new Date(j.generatedAt).toLocaleTimeString();
      });
    }).catch(function () { box.textContent = "Could not reach the server."; });
  }
  $("go").onclick = function () { var v = $("key").value.trim(); if (!v) return; setKey(v); $("key").value = ""; $("msg").textContent = ""; show(true); tabs(); load(); };
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
  $("logout").onclick = function () { setKey(""); show(false); };
  $("refresh").onclick = load;
  if (key()) { show(true); tabs(); load(); } else show(false);
})();
</script>
</body>
</html>
